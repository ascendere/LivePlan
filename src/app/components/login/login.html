<body>
  <main class="contenido">
    <section class="seccion-texto">
      <h1>COLABORADOR INTERACTIVO<br />DE PLANES DE NEGOCIO</h1>
      <h2>UTPL | Decide ser más.</h2>
    </section>

    <section class="aside">
      <section class="seccion-inicio">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="formulario-inicio">
          <div class="grupo-formulario">
            <label for="correo">Email</label>
            <input
              type="email"
              formControlName="email"
              class="entrada"
              placeholder="Ingresar email"
              id="correo"
              name="correo"
              required
            />
          </div>
          <div class="grupo-formulario">
            <label for="contrasena">Contraseña</label>
            <div class="input-group eye-inside">
              <input
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                class="entrada"
                placeholder="Ingresar contraseña"
                id="contrasena"
                name="contrasena"
                required
              />
              <button
                type="button"
                class="toggle-password"
                (click)="togglePasswordVisibility()"
                aria-label="Mostrar u ocultar contraseña"
              >
                <i [class]="showPassword() ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
              </button>
            </div>
          </div>

          @if (aviso()) {
            <p class="aviso-msg" style="color: #1b7f3b; font-size: 0.875rem; text-align: center; margin-bottom: 16px;">
              {{ aviso() }}
            </p>
          }
          @if (errorMessage()) {
            <p class="error-msg" style="color: #ff4d4f; font-size: 0.875rem; text-align: center; margin-bottom: 16px;">
              {{ errorMessage() }}
            </p>
          }
          <div class="botones-inicio">
            <button type="submit" class="btn-utpl" [disabled]="enviando()"> <i class="fa fa-lock"></i> {{ enviando() ? 'Ingresando…' : 'Iniciar Sesión' }}</button>
          </div>
          <p style="font-size: 0.8rem; text-align: center; margin-top: 12px; color: #555;">
            ¿Olvidaste tu contraseña o aún no tienes cuenta? Contacta al administrador.
          </p>
        </form>
      </section>
      <div class="imagen">
        <img src="login.jpg" alt="Login Image" class="jpg" />
      </div>
    </section>
  </main>
</body>
